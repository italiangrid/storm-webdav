<!doctype html>
<html lang="en" th:replace="~{layout.html :: layout('Storage areas index', ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<body>
  <section>
    <h3 class="mb-3">Storage areas:</h3>
    <table class="table">
      <tbody>
        <tr th:each="sa: ${saIndexMap}">
          <td>
            <a href="/sa" th:href="@{{ap}(ap=${sa.value})}" th:text="${sa.key}">fake</a>
          </td>
        </tr>
      </tbody>
    </table>
  </section>
</body>
</html>
